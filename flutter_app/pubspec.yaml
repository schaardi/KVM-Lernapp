name: kvm_trainer
description: Industriemeister Trainer – IHK-Prüfungsvorbereitung für die Industriemeister-Basisqualifikationen und die Fachrichtung Kraftverkehr (KVM).
publish_to: 'none'
version: 1.1.1+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0
  # Login (Google) + geräteübergreifender Fortschritt. Aktiv nur, wenn zur
  # Build-Zeit SUPABASE_URL/SUPABASE_ANON_KEY/GOOGLE_WEB_CLIENT_ID per
  # --dart-define gesetzt sind (siehe SUPABASE_SETUP.md). Ohne Config: Offline-App.
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.1
  # Monetarisierung (Freemium): Interstitial-Werbung alle 10 Fragen; das Abo
  # (5,99 €/Monat) schaltet werbefrei. Aktiv nur, wenn MONETIZATION_ENABLED
  # nicht auf false steht. Ohne echte AdMob-/Play-IDs laufen Test-Anzeigen.
  google_mobile_ads: ^5.1.0
  in_app_purchase: ^3.1.0
  # Lern-Erinnerung (FR-009): tägliche lokale Mitteilung zur gewählten Uhrzeit,
  # ganz ohne Server. Geplant wird mit absoluten Zeitpunkten (timezone, UTC);
  # die Ortszeit samt Sommerzeit rechnet Dart aus dem Gerät.
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/data/questions.json
    - assets/data/cases.json
    - assets/data/formulas.json
    - assets/data/anlagen.json
    - assets/anlagen/
    - assets/branding/app_logo.png
  # Schriften wie im Web (FR-002 J), offline gebündelt – Lizenz: SIL OFL 1.1,
  # siehe assets/fonts/OFL-*.txt.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
